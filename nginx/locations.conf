# Common location blocks for Nginx

# Client settings
client_max_body_size 10M;
client_body_timeout 60s;
client_header_timeout 60s;

# Health check endpoint
location /health {
    proxy_pass http://screenshot_api/health;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    
    # Allow health checks without rate limiting
    limit_req off;
}

# Nginx Plus status (comment out if using OSS Nginx)
location /api {
    api write=on;
    # Restrict access in production
    # allow 127.0.0.1;
    # deny all;
}

# Nginx Plus dashboard (comment out if using OSS Nginx)
location /dashboard.html {
    root /usr/share/nginx/html;
}

# Screenshot API - POST to create screenshots
location /screenshot {
    # Rate limiting
    limit_req zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 10;
    
    proxy_pass http://screenshot_api/screenshot;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    
    # Screenshot can take time
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
    
    # Buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 32k;
}

# List and download screenshots
location /screenshots {
    # Rate limiting (more permissive for downloads)
    limit_req zone=api_limit burst=50 nodelay;
    limit_conn conn_limit 20;
    
    proxy_pass http://screenshot_api/screenshots;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    
    # Enable caching for images
    proxy_cache_valid 200 10m;
}

# Default location
location / {
    return 200 '{"service": "Playwright Screenshot API", "version": "1.0.0", "endpoints": ["/screenshot", "/screenshots", "/health"]}';
    add_header Content-Type application/json;
}

# Error pages
error_page 500 502 503 504 /50x.html;
location = /50x.html {
    root /usr/share/nginx/html;
    internal;
}
