# Nginx configuration for Playwright Screenshot API
# This configuration works with both Nginx and Nginx Plus

upstream screenshot_api {
    zone screenshot_api 64k;
    
    # API servers - will be updated by K8s DNS
    server playwright-screenshot-api:8080;
    
    # Load balancing settings
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    server_name _;
    
    # For development, serve directly on HTTP
    include /etc/nginx/conf.d/locations.conf;
}

server {
    listen 443 ssl http2;
    server_name _;
    
    # SSL configuration (update paths for your certificates)
    ssl_certificate /etc/nginx/ssl/tls.crt;
    ssl_certificate_key /etc/nginx/ssl/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    include /etc/nginx/conf.d/locations.conf;
}
