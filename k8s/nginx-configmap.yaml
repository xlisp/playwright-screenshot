# ConfigMap for Nginx configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: playwright-screenshot
  labels:
    app: playwright-screenshot
    component: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log notice;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

        access_log /var/log/nginx/access.log main;

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

        # Upstream for API servers
        upstream screenshot_api {
            zone screenshot_api 64k;
            server playwright-screenshot-api:8080;
            keepalive 32;
        }

        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
        limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

        server {
            listen 80;
            server_name _;

            # Client settings
            client_max_body_size 10M;
            client_body_timeout 60s;
            client_header_timeout 60s;

            # Health check for Nginx itself
            location /nginx-health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # Health check endpoint (proxy to API)
            location /health {
                proxy_pass http://screenshot_api/health;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_connect_timeout 5s;
                proxy_read_timeout 10s;
                limit_req off;
            }

            # Screenshot API - POST to create screenshots
            location /screenshot {
                limit_req zone=api_limit burst=20 nodelay;
                limit_conn conn_limit 10;

                proxy_pass http://screenshot_api/screenshot;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";

                proxy_connect_timeout 10s;
                proxy_send_timeout 30s;
                proxy_read_timeout 120s;

                proxy_buffering on;
                proxy_buffer_size 4k;
                proxy_buffers 8 32k;
            }

            # List and download screenshots
            location /screenshots {
                limit_req zone=api_limit burst=50 nodelay;
                limit_conn conn_limit 20;

                proxy_pass http://screenshot_api/screenshots;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Connection "";

                proxy_connect_timeout 5s;
                proxy_read_timeout 30s;
            }

            # Root endpoint
            location / {
                return 200 '{"service": "Playwright Screenshot API", "version": "1.0.0", "endpoints": ["/screenshot", "/screenshots", "/health"]}';
                add_header Content-Type application/json;
            }

            # Error pages
            error_page 500 502 503 504 /50x.html;
            location = /50x.html {
                root /usr/share/nginx/html;
                internal;
            }
        }
    }
