# Deployment for Playwright Screenshot API Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-screenshot-api
  namespace: playwright-screenshot
  labels:
    app: playwright-screenshot
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: playwright-screenshot
      component: api
  template:
    metadata:
      labels:
        app: playwright-screenshot
        component: api
    spec:
      containers:
        - name: playwright-screenshot-api
          image: playwright-screenshot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          envFrom:
            - configMapRef:
                name: playwright-screenshot-config
          env:
            - name: PORT
              value: "8080"
          volumeMounts:
            - name: screenshots-storage
              mountPath: /app/screenshots
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: screenshots-storage
          persistentVolumeClaim:
            claimName: playwright-screenshot-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - playwright-screenshot
                topologyKey: kubernetes.io/hostname
