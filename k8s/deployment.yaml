# ═══════════════════════════════════════════════════════════════════════
# Deployment with Vault Agent Injector + Archive PVC
# ═══════════════════════════════════════════════════════════════════════
#
# Volumes:
#   /app/screenshots  ← emptyDir (ephemeral, cleared on restart)
#   /app/archive      ← PVC (persistent, survives redeploy)
#   /vault/secrets    ← Vault Agent Injector (auto-injected)
#   /dev/shm          ← tmpfs for Chrome
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-screenshot-api
  namespace: playwright-screenshot
  labels:
    app: playwright-screenshot
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: playwright-screenshot
      component: api
  template:
    metadata:
      labels:
        app: playwright-screenshot
        component: api
      annotations:
        # ── Vault Agent Injector ────────────────────────────────────
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "playwright-screenshot"
        vault.hashicorp.com/agent-inject-secret-github-token: "secret/data/playwright-screenshot/github"
        vault.hashicorp.com/agent-inject-template-github-token: |
          {{- with secret "secret/data/playwright-screenshot/github" -}}
          {{ .Data.data.github_token }}
          {{- end -}}
        vault.hashicorp.com/agent-pre-populate-only: "false"
        vault.hashicorp.com/agent-inject-token: "false"
    spec:
      serviceAccountName: playwright-screenshot
      containers:
        - name: playwright-screenshot-api
          image: playwright-screenshot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "3Gi"
              cpu: "1500m"
          envFrom:
            - configMapRef:
                name: playwright-screenshot-config
          env:
            - name: PORT
              value: "8080"
            # ── Screenshot working dir (ephemeral, OK to lose) ──
            - name: SCREENSHOTS_DIR
              value: "/app/screenshots"
            # ── Archive dir (persistent PVC, survives redeploy) ──
            - name: ARCHIVE_DIR
              value: "/app/archive"
            # ── Vault ──
            - name: VAULT_SECRET_FILE
              value: "/vault/secrets/github-token"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_K8S_ROLE
              value: "playwright-screenshot"
            # ── Screenshot kill timeout (seconds) ──
            # Chrome is killed if a single screenshot exceeds this.
            # Run `python benchmark.py` inside the pod to find the right value.
            - name: SCREENSHOT_KILL_TIMEOUT
              value: "3"
          volumeMounts:
            # Ephemeral screenshots (cleared on pod restart — that's fine)
            - name: screenshots-tmp
              mountPath: /app/screenshots
            # ⭐ Persistent archive — HTML/PNG/JSON survive redeploy
            - name: archive-storage
              mountPath: /app/archive
            # Shared memory for headless Chrome
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        # Screenshots — ephemeral, no PVC needed
        - name: screenshots-tmp
          emptyDir: {}
        # ⭐ Archive — persistent PVC
        - name: archive-storage
          persistentVolumeClaim:
            claimName: github-archive-pvc
        # Chrome needs large /dev/shm
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - playwright-screenshot
                topologyKey: kubernetes.io/hostname
