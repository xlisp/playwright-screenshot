# ═══════════════════════════════════════════════════════════════════════
# Vault + Kubernetes Integration for playwright-screenshot
# ═══════════════════════════════════════════════════════════════════════
#
# ServiceAccount with Vault auth annotations.
# The SA name MUST match the Vault K8s auth role's
# bound_service_account_names.
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: playwright-screenshot
  namespace: playwright-screenshot
  labels:
    app: playwright-screenshot
