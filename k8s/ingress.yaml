# Ingress for Playwright Screenshot API
# Use this instead of LoadBalancer if you have an Ingress Controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playwright-screenshot-ingress
  namespace: playwright-screenshot
  labels:
    app: playwright-screenshot
  annotations:
    # Nginx Ingress Controller annotations
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    # Uncomment for TLS with cert-manager
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  # Uncomment for TLS
  # tls:
  #   - hosts:
  #       - screenshot.example.com
  #     secretName: screenshot-tls
  rules:
    - host: screenshot.example.com  # Update with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
