# ═══════════════════════════════════════════════════════════════════════
# Kubernetes Secret holding the GitHub API token
# ═══════════════════════════════════════════════════════════════════════
#
# This is the simplest fallback – Pod reads GITHUB_TOKEN from env.
# For production use Vault Agent Injector or CSI instead.
#
# Usage:
#   Replace <base64-encoded-token> with:
#     echo -n "ghp_your_token_here" | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: github-token-secret
  namespace: playwright-screenshot
  labels:
    app: playwright-screenshot
type: Opaque
data:
  # echo -n "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" | base64
  GITHUB_TOKEN: "<base64-encoded-token>"
