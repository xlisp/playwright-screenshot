# ═══════════════════════════════════════════════════════════════════════
# Deployment with K8s Secret (no Vault) + Archive PVC
# ═══════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-screenshot-api
  namespace: playwright-screenshot
  labels:
    app: playwright-screenshot
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: playwright-screenshot
      component: api
  template:
    metadata:
      labels:
        app: playwright-screenshot
        component: api
    spec:
      serviceAccountName: playwright-screenshot
      containers:
        - name: playwright-screenshot-api
          image: playwright-screenshot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          envFrom:
            - configMapRef:
                name: playwright-screenshot-config
            - secretRef:
                name: github-token-secret
                optional: true
          env:
            - name: PORT
              value: "8080"
            - name: SCREENSHOTS_DIR
              value: "/app/screenshots"
            - name: ARCHIVE_DIR
              value: "/app/archive"
          volumeMounts:
            - name: screenshots-tmp
              mountPath: /app/screenshots
            - name: archive-storage
              mountPath: /app/archive
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: screenshots-tmp
          emptyDir: {}
        - name: archive-storage
          persistentVolumeClaim:
            claimName: github-archive-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
