# ═══════════════════════════════════════════════════════════════════════
# Deployment with K8s Secret (no Vault — simplest option)
# ═══════════════════════════════════════════════════════════════════════
#
# Use this if you don't have Vault. Store the token in a K8s Secret
# and the Pod reads it as an env var.
#
# Steps:
#   kubectl create secret generic github-token-secret \
#     -n playwright-screenshot \
#     --from-literal=GITHUB_TOKEN=ghp_your_token_here
#
#   kubectl apply -f k8s/deployment-k8s-secret.yaml
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-screenshot-api
  namespace: playwright-screenshot
  labels:
    app: playwright-screenshot
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: playwright-screenshot
      component: api
  template:
    metadata:
      labels:
        app: playwright-screenshot
        component: api
    spec:
      serviceAccountName: playwright-screenshot
      containers:
        - name: playwright-screenshot-api
          image: playwright-screenshot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          envFrom:
            - configMapRef:
                name: playwright-screenshot-config
            # Load ALL keys from the Secret as env vars
            - secretRef:
                name: github-token-secret
                optional: true
          env:
            - name: PORT
              value: "8080"
          volumeMounts:
            - name: screenshots-storage
              mountPath: /app/screenshots
            - name: dshm
              mountPath: /dev/shm
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: screenshots-storage
          persistentVolumeClaim:
            claimName: playwright-screenshot-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
